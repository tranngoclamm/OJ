    <script src="{{ static('vnoj/jquery.formset.js') }}"></script>
    <script type="text/javascript">
        $(function() {
            $('#form_set tr').formset({
                prefix: '{{ contest_problem_formset.prefix }}'
            });

            var noResults = function () {
                return {{ _('Press Enter to select multiple users...')|htmltojs }};
            };

            $(document).one('click', '#id_private_contestants + .select2', function (e) {
                $('#id_private_contestants').data().select2.options.get('translations').dict['noResults'] = noResults;
            });

            $(document).on('keyup', '#id_private_contestants + .select2 .select2-search__field', function (e) {
                if (e.keyCode === 13) {
                    var $id_private_contestants = $('#id_private_contestants');
                    var contestants = $(this).val().split(/[\s,]+/);
                    if (contestants.length <= 1) {
                        // Skip to let select2 handle this
                        return;
                    }

                    $.ajax({
                        type: 'GET',
                        url: $id_private_contestants.data().select2.dataAdapter.ajaxOptions.url,
                        data: {
                            multiple_terms: contestants,
                        },
                        success: function (response) {
                            for (const contestant of response.results) {
                                $id_private_contestants.select2('trigger', 'select', {
                                    data: contestant,
                                });
                            }
                        },
                    });
                }
            });
        })
    </script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const isExam = document.querySelector("#id_is_exam");
        const createAccounts = document.querySelector("#id_create_exam_accounts");
        const examRooms = document.querySelector("#id_exam_rooms");

        function updateState() {
            const isExamChecked = isExam.checked;

            // 1. Toggle exam_rooms
            if (isExamChecked) {
                examRooms.removeAttribute("disabled");
            } else {
                examRooms.setAttribute("disabled", "disabled");

                // clear select2 value
                if ($(examRooms).hasClass("select2-hidden-accessible")) {
                    $(examRooms).val(null).trigger("change");
                } else {
                    examRooms.value = null;
                }
            }

            // 2. Toggle create_exam_accounts
            if (isExamChecked) {
                createAccounts.removeAttribute("disabled");
            } else {
                createAccounts.checked = false;
                createAccounts.setAttribute("disabled", "disabled");
            }
        }

        // 3. Mutual exclusive
        function handleExclusive() {
            // Nếu chọn exam_rooms (autologin)
            $(examRooms).on("change", function () {
                const hasValue = $(this).val() && $(this).val().length > 0;
                if (hasValue) {
                    createAccounts.checked = false;
                }
            });

            // Nếu chọn create_exam_accounts
            createAccounts.addEventListener("change", function () {
                if (this.checked) {
                    // clear exam_rooms
                    $(examRooms).val(null).trigger("change");
                }
            });
        }

        // Init
        updateState();
        handleExclusive();

        // Event
        isExam.addEventListener("change", updateState);
    });
</script>

function buildMappingUI(selectedRooms) {
    body.innerHTML = "";

    });

    document.querySelector("#mapping-body tr td").style.width = (width - 2) + "px";
}

function restoreMapping() {
    const hiddenInput = document.getElementById("id_room_user_map");

    if (!hiddenInput || !hiddenInput.value) return;

    let data;
    try {
        data = JSON.parse(hiddenInput.value);
    } catch (e) {
        console.log("Invalid JSON");
        return;
    }

    console.log("Restoring:", data);

    Object.entries(data).forEach(([roomId, userIds]) => {
        const select = document.querySelector(`select[data-room="${roomId}"]`);
        if (!select) return;

        $(select).val(userIds).trigger('change');
    });
}
